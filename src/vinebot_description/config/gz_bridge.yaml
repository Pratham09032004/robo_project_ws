# Topics bridged from Gazebo to ROS 2 by ros_gz_bridge (started by launch_sim.launch.py).
#
# Odometry (/diff_cont/odom), /tf, /diff_cont/cmd_vel and /joint_states are handled by
# ros2_control (diff_cont + joint_broad) and must NOT be bridged as well, otherwise two
# publishers fight over the same topics.

- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Livox Mid-40 (urdf/vinebot_livox_mid40.xacro)
- ros_topic_name: "scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "points"
  gz_topic_name: "points/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# IMU (urdf/imu.xacro publishes on gz topic "imu")
- ros_topic_name: "imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
